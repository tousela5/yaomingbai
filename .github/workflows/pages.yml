name: 发布药明白到 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: 构建并发布静态站点
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出当前版本
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 发布前静态检查
        run: npm run release:check

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 发布后公网复核
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if npm run release:verify -- "$SITE_URL"; then
              exit 0
            fi
            echo "公网 CDN 尚未刷新，等待第 ${attempt} 次重试……"
            sleep 10
          done
          exit 1
